apiVersion: v1
kind: Service
metadata:
  name: {{ include "recon-agent.fullname" . }}
  labels:
    {{- include "recon-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: recon-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
