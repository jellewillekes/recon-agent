apiVersion: v1
kind: Secret
metadata:
  name: {{ include "recon-agent.fullname" . }}
  labels:
    {{- include "recon-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  {{- $password := include "recon-agent.postgresPassword" . }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  {{- /* urlquery escapes for a query string, where a space becomes "+"; userinfo needs "%20". */}}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" (.Values.postgresql.user | urlquery | replace "+" "%20") ($password | urlquery | replace "+" "%20") (include "recon-agent.postgresFullname" .) .Values.postgresql.database | quote }}
  {{- else }}
  DATABASE_URL: {{ .Values.secret.databaseUrl | quote }}
  {{- end }}
  CLAUDE_CODE_OAUTH_TOKEN: {{ .Values.secret.claudeCodeOauthToken | quote }}
