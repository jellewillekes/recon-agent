apiVersion: v1
kind: Secret
metadata:
  name: {{ include "recon-agent.fullname" . }}
  labels:
    {{- include "recon-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.postgresql.user .Values.postgresql.password (include "recon-agent.postgresFullname" .) .Values.postgresql.database | quote }}
  {{- else }}
  DATABASE_URL: {{ .Values.secret.databaseUrl | quote }}
  {{- end }}
  CLAUDE_CODE_OAUTH_TOKEN: {{ .Values.secret.claudeCodeOauthToken | quote }}
