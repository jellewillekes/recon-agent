# Model configuration for agent runtimes. Read by `runtimes/agent_sdk.py`
# and hashed into `EvalRun.model_config_hash` (step 5) so a scored run is
# reproducible against the config that produced it.

investigator:
  model: claude-sonnet-5
  # Bounds a single case's turn count. Every run spends real Agent SDK
  # credit (CLAUDE.md's Cost section) — this stops a confused run from
  # retrying tool calls indefinitely.
  max_turns: 20

judge:
  # Haiku rather than Sonnet to halve the judge's share of each case's cost
  # (docs/adr/0021-eval-cost-controls.md). Scores from a Sonnet judge aren't
  # comparable with these; no baseline was recorded with one.
  model: claude-haiku-4-5-20251001
  # A judge call checks a fixed list of true/false assertions against an
  # already-produced answer and tool-call trace — no tool use, no multi-step
  # reasoning, so a small turn budget is enough.
  max_turns: 2

# Static, manually-updated approximation — not a live lookup. A runtime call
# must not depend on network access beyond the Agent SDK itself, and a fixed
# rate keeps cost_eur reproducible across runs. Bump deliberately, in its own
# PR, if it drifts too far from the real rate.
usd_to_eur_rate: 0.92

# Per-model USD pricing, $ per million tokens. Only needed by
# runtimes/langgraph.py (issue #14): the Agent SDK runtime gets cost_usd
# directly from claude_agent_sdk's own ResultMessage, but LangChain's
# ChatAnthropic only reports token counts (usage_metadata), never a computed
# dollar cost - this table is what turns those into AgentResult.cost_eur.
# Source: platform.claude.com/docs/en/about-claude/pricing, 2026-09-08.
# Checked 2026-09-30: $2/$10 for claude-sonnet-5 is now the standard price, not
# the introductory one; the planned rise to $3/$15 was cancelled.
# Static and manually updated, same as usd_to_eur_rate above - bump
# deliberately if pricing changes.
pricing:
  claude-sonnet-5:
    input_usd_per_mtok: 2.00
    output_usd_per_mtok: 10.00

# Per-run ceilings (the whole case, not one query() call — multi mode's
# up to seven calls, decompose + up to four workers + synthesis + critic,
# share these). A breach ends the run gracefully with a partial AgentResult
# instead of hanging or crashing (issue #13).
run_budget:
  # Generous for a normal run (multi mode's two workers, a few tool calls
  # each) but well short of a genuine retry/routing loop.
  max_tool_calls: 30
  # Well above a typical run's usage; catches a runaway loop, not normal cost.
  # 450k, up from 300k: a single-mode case used 349k on the text cases.
  max_tokens: 450000
  # Under api/main.py's own RECON_API_REQUEST_TIMEOUT_S default (270s), so on
  # a breach the run still ends with this budget's graceful partial
  # AgentResult instead of the API's blunter 504 with no body. CLI/eval
  # callers have no other wall-clock bound at all, so this is their only one.
  # 150, up from 100 (#99): with filing-text search, three of the seven text
  # cases took 87-100s, and one ran out.
  max_wall_clock_s: 150

# Multi mode's values over run_budget's (runtimes/run_budget.py). It runs a
# supervisor, workers and a critic per case: 109 s per case on average on the
# text cases, against single's 58 s, and 2 of 7 hit 150 s. Still under the
# API's 270 s request timeout.
run_budget_multi:
  max_wall_clock_s: 240
