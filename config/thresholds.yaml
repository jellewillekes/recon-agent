# Thresholds for the promotion gate and the committed baseline (docs/contracts.md
# §9). AGENTS.md: never lower one to make a run pass. Changing a value is the
# user's decision, in its own PR.

gate:
  # A candidate fails when its answer_score_mean drops by more than this, in
  # absolute terms. Two identical runs of the 7 text cases differed by 0.044,
  # and one case can move a 7-case mean by about 0.07 (docs/eval-noise.md,
  # #77). Set by the user on 2026-10-07; it replaced a 2% relative drop, which
  # failed an unchanged repeat of the baseline.
  answer_score_noise_band: 0.10
  # ...or when more than this many cases stop completing. One case dropped
  # between the two identical runs (#77).
  task_completion_max_case_drop: 1
  # ...or when total_cost_eur rises by more than this share without a rise in
  # task completion.
  cost_max_relative_rise: 0.20

# A case counts as correct when its answer_score is at least this, for
# cost_per_correct_answer_eur (#77). Set by the user after the first smoke
# baseline (2026-10-01), where 5 of 7 cases reached it.
correct_answer_score: 0.5

# Aggregate metrics evals/baseline.json must reach, checked in CI
# (scripts/check_baseline.py). Set by the user after reviewing the first smoke
# baseline (answer_score_mean 0.566, task_completion_rate 1.0), with room for
# one case of noise.
baseline_minimums:
  answer_score_mean: 0.5
  task_completion_rate: 0.85
