# Minimal Tempo config: OTLP receivers and local storage. `recon.cli eval`
# and the API export here when OTEL_EXPORTER_OTLP_ENDPOINT is set
# (docs/observability.md). TraceQL metrics, which the Grafana dashboard
# queries, are on by default in Tempo 3 and need no metrics generator.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
