# Dev stack: docs/implementation-plan.md's "Where it runs" table. Kubernetes
# orchestration (k3d + charts/recon-agent/) is a separate layer - see
# docs/deployment.md.
#
# Passwords come from docker/.env (gitignored). Copy docker/.env.example to
# docker/.env first; compose refuses to start with them unset.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: recon
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in docker/.env - see docker/.env.example}
    ports:
      # Host side configurable: another service may already hold 5432 on the
      # host (e.g. an SSH tunnel). Containers still reach postgres:5432.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon -d recon"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set it in docker/.env - see docker/.env.example}
    volumes:
      # Tempo and Prometheus datasources and the eval-runs dashboard
      # (docs/observability.md).
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200" # Tempo query
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  ollama:
    image: ollama/ollama:0.34.4
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://recon:${POSTGRES_PASSWORD:?set it in docker/.env - see docker/.env.example}@postgres:5432/recon
      RECON_API_MAX_CONCURRENCY: "4"
      RECON_API_REQUEST_TIMEOUT_S: "120"
      # No EDGAR cache in the image (docs/deployment.md).
      RECON_TOOL_DATA: fixture
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  tempo-data:
  ollama-data:
