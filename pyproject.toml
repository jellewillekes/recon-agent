[project]
name = "recon-agent"
version = "0.1.0"
description = "Agent evaluation platform for financial research tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.150",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "mcp>=2.1.1",
    "polars>=1.44.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon"]

[tool.pytest.ini_options]
markers = [
    "llm: marks tests that call a model (excluded from CI)",
]
