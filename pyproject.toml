[project]
name = "recon-agent"
version = "0.1.0"
description = "Agent evaluation platform for financial research tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.150",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "mcp>=2.1.1",
    "polars>=1.44.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon"]

[tool.ruff]
extend-exclude = ["*.md"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "llm: marks tests that call a model (excluded from CI)",
    "unit: fast, hermetic tests with no external services",
    "integration: multi-component tests using local infra (DuckDB, Postgres, k3d)",
    "e2e: golden-path verification, typically run via the docker/k3d stack",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "types-pyyaml>=6.0.12.20260815",
]
