[project]
name = "recon-agent"
version = "0.1.0"
description = "Agent evaluation platform for financial research tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "claude-agent-sdk>=0.2.150",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.1",
    "langchain-mcp-adapters>=0.3.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "mcp>=1.30.0,<2.0.0",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pgvector>=0.5.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon"]

[tool.ruff]
extend-exclude = ["*.md"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "llm: marks tests that call a model (excluded from CI)",
    "unit: fast, hermetic tests with no external services",
    "integration: multi-component tests using local infra (DuckDB, Postgres, k3d)",
    "e2e: golden-path verification, typically run via the docker/k3d stack",
]

[project.optional-dependencies]
# Embeddings and the reranker for the filing-text index (docs/adr/0025). Only
# `recon.cli edgar index-text` and a search_knowledge call load them, so the
# API image, which runs on the fixture, leaves them out and stays small.
# Install with `uv sync --extra knowledge`.
knowledge = [
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "types-pyyaml>=6.0.12.20260815",
]

# CPU-only PyTorch on Linux (CI, the image): sentence-transformers would
# otherwise pull the CUDA build and its GPU libraries, several GB the image
# never uses. macOS wheels on PyPI are CPU builds already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
