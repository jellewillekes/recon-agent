name: Links

# External links in the docs, weekly. Relative links are checked on every PR
# by tests/test_docs_links.py in `make check`, so this job only adds the
# network part. It also runs on PRs that change this file, to test itself.
on:
  schedule:
    - cron: "5 4 * * 1" # Mondays 04:05 UTC
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/links.yml"

permissions: {}

jobs:
  external:
    name: External links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # sec.gov answers 403 to any client without a registered contact
      # User-Agent (docs/data-sources.md), so its links can't be checked here.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --exclude 'sec\.gov'
            README.md CONTRIBUTING.md AGENTS.md 'docs/**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
