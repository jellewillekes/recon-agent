name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail if forbidden paths are tracked
        shell: bash
        run: scripts/precommit_block_forbidden_tracked_paths.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: hygiene

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Prompts match evals/baseline.json
        run: uv run python scripts/check_prompt_baseline.py

      - name: Baseline is usable and clears its minimums
        run: uv run python scripts/check_baseline.py

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: hygiene

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Mypy
        run: uv run mypy --config-file mypy.ini src tests

  unit:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: hygiene

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Run tests (excluding llm marker)
        run: uv run pytest -q -m "not llm"

  web:
    name: Web front end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: hygiene
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (locked)
        run: npm ci --no-audit --no-fund

      # web/openapi.json is checked against the API by tests/test_api_web.py.
      # These are the types generated from it: stale types fail here.
      - name: API types match web/openapi.json
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke tests (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  image:
    name: Image build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: hygiene

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -f docker/Dockerfile -t recon-agent:ci .

      - name: Install Trivy
        run: scripts/install_pinned_tool.sh trivy "$RUNNER_TEMP/bin"

      # Fails on HIGH and CRITICAL findings that have a fixed version. Unfixed
      # base-image CVEs have nothing to upgrade to, so they're listed but don't
      # fail the job. See docs/ci.md.
      - name: Scan image
        run: |
          "$RUNNER_TEMP/bin/trivy" image --quiet --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 recon-agent:ci

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: hygiene

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        run: scripts/install_pinned_tool.sh helm "$RUNNER_TEMP/bin"

      - name: Lint chart
        run: '"$RUNNER_TEMP/bin/helm" lint charts/recon-agent'
