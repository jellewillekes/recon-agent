name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Fail if forbidden paths are tracked
        shell: bash
        run: scripts/precommit_block_forbidden_tracked_paths.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: hygiene

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v7
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: hygiene

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v7
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Mypy
        run: uv run mypy --config-file mypy.ini src tests

  unit:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: hygiene

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v7
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Run tests (excluding llm marker)
        run: uv run pytest -q -m "not llm"
