name: Company names

# AGENTS.md forbids naming companies in code, commits, docs and PR text. The
# denylist is the HYGIENE_DENYLIST secret, never a committed file. A separate
# workflow so an edited PR title or body re-runs this check without re-running
# CI. See docs/ci.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: company-names-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Company names
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync (locked)
        run: uv sync --frozen --no-dev

      # Dependabot and fork PRs can't read repository secrets, so for those a
      # missing list is a notice rather than a failure.
      - name: Check files, commit messages and PR text
        env:
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SECRETS_READABLE: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        run: |
          args=(check)
          if [[ "${SECRETS_READABLE}" == "true" ]]; then
            args+=(--require-list)
          fi
          # A new branch has an all-zeros "before", and a force-push leaves one
          # the clone doesn't have. Scan files and PR text only in those cases.
          if [[ -n "${BASE_SHA}" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            args+=(--commits "${BASE_SHA}..${HEAD_SHA}")
          fi
          uv run --no-dev python scripts/check_hygiene.py "${args[@]}"
