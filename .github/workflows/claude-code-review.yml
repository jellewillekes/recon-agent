name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1

      # claude-code-action restores .claude/ and CLAUDE.md from the default
      # branch because the PR head is untrusted, but not AGENTS.md, which
      # CLAUDE.md imports. Without this step a PR could rewrite the rules its
      # own reviewer follows. skip-worktree keeps git from committing the
      # restored copy over the PR's own AGENTS.md. A no-op until the default
      # branch has an AGENTS.md. See docs/adr/0017-claude-code-project-setup.md.
      - name: Use the default branch's AGENTS.md (PR head is untrusted)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
          if git cat-file -e FETCH_HEAD:AGENTS.md 2>/dev/null; then
            git show FETCH_HEAD:AGENTS.md > AGENTS.md
            if git ls-files --error-unmatch AGENTS.md >/dev/null 2>&1; then
              git update-index --skip-worktree AGENTS.md
            else
              # The PR deleted it: keep the restored copy out of `git add -A`.
              echo AGENTS.md >> "$(git rev-parse --git-path info/exclude)"
            fi
            echo "AGENTS.md restored from $DEFAULT_BRANCH"
          else
            echo "No AGENTS.md on $DEFAULT_BRANCH; nothing to restore"
          fi

      - uses: anthropics/claude-code-action@56cf60fde42f7b19c3abfd5c9c48b69a1288461f # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Re-review runs happen when the implement agent pushes a fix commit.
          # Two separate bot identities show up here: the commit's author is
          # claude[bot] (the action's own bot_id/bot_name), but the git push
          # itself authenticates with claude-respond-to-review.yml's default
          # GITHUB_TOKEN (that workflow's checkout step doesn't override it),
          # so the resulting "synchronize" event's actor is github-actions[bot].
          # Without both listed here, the human-actor check rejects that run
          # and the loop stalls - confirmed live: an unlisted github-actions[bot]
          # push failed with "Workflow initiated by non-human actor".
          allowed_bots: "claude[bot],github-actions[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            Review this pull request as a senior engineer. Focus on correctness,
            security, data integrity, and the stated requirements. Design and
            best-practice discussion is welcome as non-blocking feedback.
            Prefix each inline finding with exactly one of `Blocking:`,
            `Question:`, or `Note:`. Use `Blocking:` only when you can name a
            concrete input or state that produces incorrect behavior or violates
            a requirement, and explain that case. If a Question or Note reveals
            such a defect, rewrite it as a Blocking finding with the concrete
            case. Do not turn a preference, cleanup suggestion, or hypothetical
            future risk into a Blocking finding.

            Steps:
            1. Use mcp__github__get_pull_request_reviews to list existing reviews
               on this PR. Count how many were submitted by a "claude" actor with
               state CHANGES_REQUESTED - call this N (0 if none). This run is
               round N+1.
            2. Use mcp__github__get_pull_request_diff and mcp__github__get_pull_request
               to read the actual diff and the PR description/linked issue. These tools
               only show the PR's own diff against its merge base - a file that arrived
               on this branch via merging main won't appear there even though it's
               genuinely present in the final tree. Don't call such a file "missing"
               without checking whether it actually exists.
            3. Some concerns are not the implementer's to resolve automatically,
               regardless of round number: anything in AGENTS.md's "Forbidden
               without explicit permission" list (golden-set/expected-answer
               content, evaluation thresholds, new dependencies, repository
               layout or module boundaries, secrets/API keys), or a point the
               PR description itself already flags as a draft or a judgement
               call pending review. Still comment on these if they tie to
               code, but call them out in the review body as a distinct
               "Needs a human decision:" line, separate from ordinary
               correctness/design findings.
            4. Create a pending review with mcp__github__create_pending_pull_request_review.
               Every concern that ties to specific code is an inline comment via
               mcp__github__add_comment_to_pending_review - the review body is not a
               place to restate them. Use the body only for a short overall summary,
               the "Needs a human decision:" line from step 3 if any, plus (round
               N+1 > 1) a compact status list: one line each for Open / Resolved /
               New, before any other prose. Then submit with
               mcp__github__submit_pending_pull_request_review:
               - Only unresolved `Blocking:` findings beyond step 3's human-decision
                 items can trigger REQUEST_CHANGES, and only when round N+1 <= 3.
               - `Question:` and `Note:` findings never trigger REQUEST_CHANGES.
                 Submit COMMENT when any non-blocking findings or human-decision
                 items need to be shared; otherwise APPROVE. Do not use
                 REQUEST_CHANGES for something only a human can decide.
               - Round N+1 > 3 and ordinary `Blocking:` findings remain: do NOT use
                 REQUEST_CHANGES. Submit with event COMMENT, summarize what's
                 still unresolved, and say plainly: "Reached the automatic
                 review cap (3 rounds) - this needs a human to weigh in."
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github__get_pull_request_reviews,mcp__github__get_pull_request,mcp__github__get_pull_request_diff,mcp__github__get_pull_request_files,mcp__github__create_pending_pull_request_review,mcp__github__add_comment_to_pending_review,mcp__github__submit_pending_pull_request_review"
            --append-system-prompt "Follow AGENTS.md's Voice section for the review body and every inline comment you write."
