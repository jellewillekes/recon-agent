name: Claude Codebase Scan

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@8251c103ac8c1d761882c86aba1412c7f583c844 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Scan this repository for concrete problems worth tracking: bugs, missing
            error handling, security concerns, TODO/FIXME markers, and notable tech debt.

            Before filing anything:
            1. Use mcp__github__search_issues to check for an existing open issue
               covering the same problem. Skip it if one already exists.
            2. Only file issues for specific, verifiable problems you can point to a
               file and line for. Do not file vague, speculative, or stylistic issues.
            3. File at most 5 new issues in this run.

            For each new issue, call mcp__github__create_issue with:
            - A clear, specific title naming the problem
            - A body citing the file(s)/line(s), the problem, and a concrete suggested fix
            - The label "claude-implement" only if it's narrow and safe enough that you'd
              be confident fixing it yourself with no further input; otherwise leave it
              unlabeled for a human to triage.
          claude_args: |
            --allowedTools "mcp__github__search_issues,mcp__github__create_issue,mcp__github__list_issues"
