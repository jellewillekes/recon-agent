name: Claude Respond to Review

on:
  pull_request_review:
    types: [submitted]

jobs:
  respond:
    if: |
      github.event.review.state == 'changes_requested' &&
      contains(github.event.review.user.login, 'claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      # claude-code-action restores .claude/ and CLAUDE.md from the default
      # branch because the PR head is untrusted, but not AGENTS.md, which
      # CLAUDE.md imports. Without this step a PR could rewrite the rules its
      # own reviewer follows. skip-worktree keeps git from committing the
      # restored copy over the PR's own AGENTS.md. A no-op until the default
      # branch has an AGENTS.md. See docs/adr/0017-claude-code-project-setup.md.
      - name: Use the default branch's AGENTS.md (PR head is untrusted)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
          if git cat-file -e FETCH_HEAD:AGENTS.md 2>/dev/null; then
            git show FETCH_HEAD:AGENTS.md > AGENTS.md
            if git ls-files --error-unmatch AGENTS.md >/dev/null 2>&1; then
              git update-index --skip-worktree AGENTS.md
            fi
            echo "AGENTS.md restored from $DEFAULT_BRANCH"
          else
            echo "No AGENTS.md on $DEFAULT_BRANCH; nothing to restore"
          fi

      - uses: anthropics/claude-code-action@56cf60fde42f7b19c3abfd5c9c48b69a1288461f # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job's own `if:` only fires for a REQUEST_CHANGES review
          # submitted by the reviewer bot itself. allowed_bots then lets that
          # bot-authored review event actually trigger this job - see the
          # matching note in claude-code-review.yml.
          allowed_bots: "claude[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            A reviewer just requested changes on this pull request you opened.
            Use mcp__github__get_pull_request_reviews and
            mcp__github__get_pull_request_review_comments to read the review body and
            its inline comments.

            For each point raised, decide on its merits:
            - Real bug, missing edge case, or clear improvement: fix it in the
              code and commit the change.
            - You disagree, or think the reviewer's suggestion is worse than the
              current approach: don't just comply - explain your reasoning and
              propose your preferred solution. Pushing back with a concrete
              argument is fine and expected.
            - Falls under AGENTS.md's "Forbidden without explicit permission"
              list (golden-set/expected-answer content, evaluation thresholds,
              new dependencies, repository layout or module boundaries,
              secrets/API keys), or the PR description itself already flags the
              point as a draft or a judgement call pending review: this is not
              yours to resolve. Don't touch the code for it - say plainly in
              the summary comment that it needs the user's decision.
            - Ambiguous, and not one of the above: say what you'd do and why,
              and note the tradeoff.

            Post one summary comment on the PR (mcp__github__add_issue_comment,
            issue number = PR number): one bullet per point raised, covering what
            you changed and, for anything you didn't change, why. Then push any
            code changes as a new commit on this branch.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,Bash(git:*),Bash(uv run pytest:*),Bash(uv run ruff:*),mcp__github__get_pull_request_reviews,mcp__github__get_pull_request_review_comments,mcp__github__get_pull_request,mcp__github__get_pull_request_diff,mcp__github__add_issue_comment"
            --append-system-prompt "Follow AGENTS.md's Voice section for your summary comment."
