repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        # Helm templates use Go-template control syntax ({{- if ... }}) that
        # isn't valid plain YAML; `helm lint` covers them, run separately
        # (make/CI). Chart.yaml and values.yaml are plain YAML and stay checked.
        exclude: ^charts/.*/templates/
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: block-forbidden-tracked-paths
        name: Block forbidden tracked paths
        entry: scripts/precommit_block_forbidden_tracked_paths.sh
        language: script
        pass_filenames: false
        stages: [pre-commit, pre-push]
